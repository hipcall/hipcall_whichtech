name: Elixir CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  mix_test:
    name: mix test (Elixir ${{matrix.elixir}} | OTP ${{matrix.otp}})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: 1.17.x
            otp: 27
            os: ubuntu-22.04
          - elixir: 1.18.x
            otp: 27
            os: ubuntu-latest
          - elixir: 1.19.x
            otp: 28
            os: ubuntu-latest
          - elixir: 1.20.0-rc.4
            otp: 28.4.2
            os: ubuntu-latest
            warnings_as_errors: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Install Dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only test
      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ~/.hex
            ~/.mix
            _build
          key: ${{ matrix.otp }}-${{ matrix.elixir }}-build
      - run: mix compile --warnings-as-errors

      - name: Tests & Coverage
        run: |
          mix test --cover --export-coverage default
          mix test.coverage > coverage.out 2>&1 || true

      - name: Mix Coverage
        if: always()
        uses: hipcall/mix-coverage-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file: coverage.out
          minimum-coverage: 90
          # All matrix versions gate on the threshold. Only the newest Elixir
          # job posts the sticky comment so the 4 jobs don't race on the same
          # comment marker.
          comment: ${{ startsWith(matrix.elixir, '1.20') && 'sticky' || 'off' }}
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out
        uses: actions/checkout@v3

      - name: Publish package to hex.pm
        uses: hipcall/github_action_publish_hex@v1
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}